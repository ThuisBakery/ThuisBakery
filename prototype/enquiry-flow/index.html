<title>Thuis Enquiry Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..600&display=swap">
<style>
/*
  PROTOTYPE, throwaway. Answers: how few scrolls and taps can it take to get from the
  homepage to a sent Enquiry, and what should the site look like doing it?
  Dummy data from the seeded catalogue. Nothing is sent anywhere.
*/
:root {
  --ground: #EEF0EA; --surface: #F9FAF6; --ink: #1D2117; --muted: #555C4B; --line: #D5D9CD;
  --accent: #A63D25; --accent-ink: #FBF8F3; --tint: #E1E6D3; --sel: #4F5A31; --sel-ink: #F3F4EC;
  --danger: #B3261E; --shadow: 0 1px 2px rgb(29 33 23 / .06), 0 12px 32px rgb(29 33 23 / .10);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px; --bar-h: 0px; --head-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ground:#151812; --surface:#1E221A; --ink:#ECEEE5; --muted:#A7AD9B; --line:#33392C; --accent:#E07356; --accent-ink:#151812; --tint:#232A1B; --sel:#A3B170; --sel-ink:#151812; --danger:#F28B82; color-scheme: dark; }
}
:root[data-theme="dark"] { --ground:#151812; --surface:#1E221A; --ink:#ECEEE5; --muted:#A7AD9B; --line:#33392C; --accent:#E07356; --accent-ink:#151812; --tint:#232A1B; --sel:#A3B170; --sel-ink:#151812; --danger:#F28B82; color-scheme: dark; }

/* The palettes under test. The prototype resolves light or dark itself (the site's own toggle). */
/* The site today: Jana's card (ADR-0004), for comparison. */
:root[data-palette="card"][data-scheme="light"] { --ground:#EAE3D9; --surface:#F4EFE6; --ink:#3E2E26; --muted:#63544A; --line:#CFC4B5; --accent:#4F5A31; --accent-ink:#F4EFE6; --tint:#E1D8CB; --sel:#3E2E26; --sel-ink:#F4EFE6; --danger:#B3261E; color-scheme: light; }
:root[data-palette="card"][data-scheme="dark"]  { --ground:#2A1F19; --surface:#362A22; --ink:#F4EFE6; --muted:#B9AA9C; --line:#4A3B31; --accent:#93A06A; --accent-ink:#21261A; --tint:#33271F; --sel:#F4EFE6; --sel-ink:#2A1F19; --danger:#F28B82; color-scheme: dark; }
:root[data-palette="olive"][data-scheme="light"] { --ground:#EEF0EA; --surface:#F9FAF6; --ink:#1D2117; --muted:#555C4B; --line:#D5D9CD; --accent:#A63D25; --accent-ink:#FBF8F3; --tint:#E1E6D3; --sel:#4F5A31; --sel-ink:#F3F4EC; --danger:#B3261E; color-scheme: light; }
:root[data-palette="olive"][data-scheme="dark"]  { --ground:#151812; --surface:#1E221A; --ink:#ECEEE5; --muted:#A7AD9B; --line:#33392C; --accent:#E07356; --accent-ink:#151812; --tint:#232A1B; --sel:#A3B170; --sel-ink:#151812; --danger:#F28B82; color-scheme: dark; }
:root[data-palette="slate"][data-scheme="light"] { --ground:#E8EBEE; --surface:#F6F7F9; --ink:#1C2229; --muted:#56606B; --line:#D0D5DB; --accent:#B24E2A; --accent-ink:#FBF7F4; --tint:#DDE2E7; --sel:#2E3A47; --sel-ink:#F1F3F5; --danger:#B3261E; color-scheme: light; }
:root[data-palette="slate"][data-scheme="dark"]  { --ground:#14181D; --surface:#1D232A; --ink:#E7EBEF; --muted:#9AA5B0; --line:#2F3740; --accent:#E27B52; --accent-ink:#14181D; --tint:#1A2027; --sel:#C9D3DD; --sel-ink:#14181D; --danger:#F28B82; color-scheme: dark; }
:root[data-palette="pistachio"][data-scheme="light"] { --ground:#F4F4F1; --surface:#FCFCFA; --ink:#151515; --muted:#5C5C57; --line:#DCDCD6; --accent:#A5CF7C; --accent-ink:#151515; --tint:#EAF2DF; --sel:#151515; --sel-ink:#F4F4F1; --danger:#B3261E; color-scheme: light; }
:root[data-palette="pistachio"][data-scheme="dark"]  { --ground:#111111; --surface:#1B1B1A; --ink:#EFEFEA; --muted:#A2A29B; --line:#2C2C2A; --accent:#B3DB8B; --accent-ink:#111111; --tint:#1C2317; --sel:#EFEFEA; --sel-ink:#111111; --danger:#F28B82; color-scheme: dark; }
:root[data-palette="forest"][data-scheme="light"] { --ground:#EBEDE4; --surface:#F7F8F2; --ink:#15261C; --muted:#4E5E53; --line:#D2D8CB; --accent:#D8922A; --accent-ink:#15261C; --tint:#DCE3D5; --sel:#1F3A2A; --sel-ink:#EEF1E8; --danger:#B3261E; color-scheme: light; }
:root[data-palette="forest"][data-scheme="dark"]  { --ground:#0E1813; --surface:#16231B; --ink:#E6EBE2; --muted:#9FB0A4; --line:#26372C; --accent:#E8A94C; --accent-ink:#0E1813; --tint:#14231A; --sel:#BFD6C1; --sel-ink:#0E1813; --danger:#F28B82; color-scheme: dark; }
:root[data-scheme="dark"] { --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 16px 40px rgb(0 0 0 / .45); }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--head-h) + 16px); }
html.locked { overflow: hidden; }
body { background: var(--ground); color: var(--ink); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; transition: background-color .3s, color .3s; }
img { max-width: 100%; display: block; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
button, label, a, summary, [data-action] { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 768px) { .wrap { padding-inline: 32px; } }
.display { font-family: var(--display); font-weight: 650; letter-spacing: -0.02em; line-height: 1.05; text-wrap: balance; }
.muted { color: var(--muted); }
.icon { width: 1.15em; height: 1.15em; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 24px; border-radius: 999px; border: 1.5px solid transparent; font-weight: 550; font-size: 16px; white-space: nowrap; text-decoration: none; transition: transform .15s ease, background-color .2s, border-color .2s, box-shadow .2s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn-ghost { background: transparent; border-color: color-mix(in srgb, var(--ink) 28%, transparent); color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink); }
.btn-quiet { background: transparent; color: var(--ink); padding: 0 14px; }
.btn-quiet:hover { background: var(--tint); }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--ink); transition: background-color .2s, transform .15s; }
.icon-btn:hover { background: var(--tint); }
.icon-btn:active { transform: scale(.94); }
.btn-block { width: 100%; }

/* Header */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.site-head .wrap { display: flex; align-items: center; gap: 8px; height: var(--head-h); }
.wordmark { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.03em; text-decoration: none; margin-right: auto; display: inline-flex; align-items: baseline; gap: 6px; }
.wordmark small { font-family: var(--body); font-weight: 500; font-size: 12px; letter-spacing: .04em; color: var(--muted); }
.nav { display: none; gap: 4px; align-items: center; }
.nav a, .nav button { text-decoration: none; font-size: 15px; font-weight: 500; padding: 10px 14px; border-radius: 999px; border: 0; background: transparent; transition: background-color .2s; }
.nav a:hover, .nav button:hover { background: var(--tint); }
@media (min-width: 768px) { .nav { display: flex; } }
.head-custom { display: inline-flex; }
@media (min-width: 768px) { .head-custom { display: none; } }
.head-custom.btn { min-height: 40px; padding: 0 16px; font-size: 14px; }

/* Hero */
.hero { padding-block: 28px 20px; display: grid; gap: 28px; }
.hero h1 { font-size: clamp(2.3rem, 4.2vw + 1rem, 4.25rem); margin: 0; max-width: 14ch; }
.hero p { margin: 16px 0 0; font-size: 18px; max-width: 42ch; color: var(--muted); }
.hero .ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.hero-photo { display: none; }
@media (min-width: 900px) {
  .hero { grid-template-columns: 1.05fr 1fr; align-items: center; padding-block: 48px 40px; gap: 56px; }
  .hero-photo { display: block; border-radius: var(--r); overflow: hidden; aspect-ratio: 5/4; }
  .hero-photo img { width: 100%; height: 100%; object-fit: cover; }
}
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 22px; font-size: 14px; color: var(--muted); }
.facts span { display: inline-flex; align-items: center; gap: 6px; }

/* Cake tiles */
.section { padding-block: 40px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.section-head h2 { font-size: clamp(1.8rem, 2vw + 1rem, 2.6rem); margin: 0; }
.jump { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 20px; padding: 0 16px; }
.jump::-webkit-scrollbar { display: none; }
.jump a { flex: none; text-decoration: none; font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); transition: border-color .2s, background-color .2s; }
.jump a:hover { border-color: var(--ink); }
.tiles { display: grid; gap: 28px 20px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(6, 1fr); } .tile { grid-column: span 3; } .tile.t3 { grid-column: span 2; } }
.tile { text-decoration: none; display: flex; flex-direction: column; gap: 12px; border-radius: var(--r); }
.tile-photo { position: relative; overflow: hidden; border-radius: var(--r); aspect-ratio: 4/3; background: var(--tint); }
.tile-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.16,1,.3,1); }
.tile:hover .tile-photo img { transform: scale(1.04); }
.tile:active { transform: scale(.99); }
.tile-cat { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .01em; }
.tile-row { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.tile-name { font-family: var(--display); font-weight: 650; font-size: 23px; letter-spacing: -0.015em; line-height: 1.15; margin: 2px 0 4px; }
.tile-meta { font-size: 14px; color: var(--muted); }
.tile-price { font-weight: 550; white-space: nowrap; }
.tile-go { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); flex: none; transition: background-color .2s, color .2s, transform .2s; }
.tile:hover .tile-go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); transform: translateX(2px); }

/* Home lower sections */
.custom-band { position: relative; border-radius: var(--r); overflow: hidden; display: grid; min-height: 380px; }
.custom-band img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.custom-band .panel { position: relative; align-self: end; margin: 16px; padding: 24px; background: var(--surface); border-radius: var(--r); max-width: 440px; box-shadow: var(--shadow); }
.custom-band h2 { font-size: 30px; margin: 0 0 8px; }
.custom-band p { margin: 0 0 18px; color: var(--muted); }
@media (min-width: 900px) { .custom-band { min-height: 460px; } .custom-band .panel { margin: 32px; padding: 32px; } }
.steps { display: grid; gap: 0; border-top: 1px solid var(--line); }
.steps li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.steps strong { display: block; font-family: var(--display); font-size: 20px; font-weight: 650; }
.steps span.i { width: 44px; height: 44px; border-radius: 999px; background: var(--tint); display: grid; place-items: center; }
@media (min-width: 900px) { .steps { grid-template-columns: repeat(3, 1fr); border-top: 0; gap: 24px; } .steps li { border-bottom: 0; border-top: 1px solid var(--ink); padding-top: 20px; } }
.about { display: grid; gap: 24px; align-items: center; }
.about img { border-radius: var(--r); aspect-ratio: 4/3; object-fit: cover; width: 100%; }
.about h2 { font-size: clamp(1.8rem, 2vw + 1rem, 2.6rem); margin: 0 0 12px; }
.about p { margin: 0 0 12px; max-width: 58ch; color: var(--muted); }
@media (min-width: 900px) { .about { grid-template-columns: 1fr 1.1fr; gap: 64px; } }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; font-weight: 550; font-size: 17px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary .icon { transition: transform .25s; }
.faq details[open] summary .icon { transform: rotate(45deg); }
.faq details p { margin: 0 0 18px; color: var(--muted); max-width: 62ch; }
.foot { margin-top: 48px; padding-block: 32px calc(40px + var(--bar-h)); border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: space-between; }

/* Item page */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); padding-block: 14px; }
.crumbs a { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.crumbs a:hover { color: var(--ink); }
.item { display: grid; gap: 20px; padding-bottom: 40px; }
.gallery { display: grid; gap: 10px; min-width: 0; }
.gallery-main { border-radius: var(--r); overflow: hidden; background: var(--tint); aspect-ratio: 4/3; max-height: 46dvh; width: 100%; }
.gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.thumbs { display: flex; gap: 8px; }
.thumb-btn { width: 64px; height: 64px; padding: 0; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: var(--tint); opacity: .7; transition: opacity .2s, border-color .2s, transform .12s; }
.thumb-btn img { width: 100%; height: 100%; object-fit: cover; }
.thumb-btn:hover { opacity: 1; }
.thumb-btn:active { transform: scale(.96); }
.thumb-btn[aria-pressed="true"] { opacity: 1; border-color: var(--ink); }
.item-info h1 { font-size: clamp(2rem, 2.4vw + 1.2rem, 3.1rem); margin: 0; }
.item-cat { font-size: 14px; font-weight: 500; color: var(--muted); margin: 0 0 6px; }
.item-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 10px; }
.item-price strong { font-size: 22px; font-weight: 600; }
.item-desc { margin: 14px 0 0; max-width: 56ch; }
.more-link { border: 0; background: none; padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: 15px; font-weight: 500; color: var(--ink); }
.keyfacts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; padding: 14px 16px; border-radius: var(--r); background: var(--tint); font-size: 14px; }
.keyfacts div { display: flex; gap: 8px; align-items: start; }
.keyfacts b { display: block; font-weight: 600; }
.cta-inline { margin-top: 20px; display: none; }
@media (min-width: 900px) {
  .item { grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: start; }
  .gallery { position: sticky; top: calc(var(--head-h) + 24px); }
  .gallery-main { aspect-ratio: 1/1; max-height: calc(100dvh - var(--head-h) - 140px); }
  .thumb-btn { width: 76px; height: 76px; }
  .item-info { position: sticky; top: calc(var(--head-h) + 24px); }
  .item.v-a .item-info { position: static; }
  .cta-inline { display: flex; }
}
.allergy { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; }
.allergy b { font-weight: 600; margin-right: 6px; }
.allergy p { margin: 4px 0 0; color: var(--muted); }
.after { padding-block: 32px 8px; border-top: 1px solid var(--line); }
.after-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
.after h2 { font-size: 26px; margin: 0; }
.occasion-links { display: flex; flex-wrap: wrap; gap: 6px; }
.occasion-links a, .occasion-links button { min-height: 38px; font-size: 14px; padding: 0 14px; }
.minis { display: grid; gap: 10px; }
@media (min-width: 700px) { .minis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mini { display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 14px; padding: 8px; padding-right: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-decoration: none; transition: border-color .2s, transform .12s; }
.mini:hover { border-color: var(--ink); }
.mini:active { transform: scale(.99); }
.mini img { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; }
.mini b { display: block; font-family: var(--display); font-weight: 650; font-size: 17px; line-height: 1.2; letter-spacing: -0.01em; }
.mini span { font-size: 14px; color: var(--muted); }

/* Sticky bottom bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.bar .inner { max-width: 1240px; margin-inline: auto; display: flex; align-items: center; gap: 14px; }
.bar .est { margin-right: auto; line-height: 1.2; min-width: 0; }
.bar .est span { display: block; font-size: 12px; color: var(--muted); }
.bar .est strong { font-size: 20px; font-weight: 600; }
.bar.b-only { display: block; }
@media (min-width: 900px) { .bar.b-only { display: none; } }

/* Form parts */
.form { display: grid; gap: 28px; }
.group { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 10px; }
.group > legend, .label { font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 12px; width: 100%; }
.label .opt, legend .opt { font-weight: 400; color: var(--muted); font-size: 14px; }
.hint { font-size: 14px; color: var(--muted); margin: -4px 0 0; }
.error { font-size: 14px; color: var(--danger); margin: 0; display: none; align-items: center; gap: 6px; font-weight: 500; }
.has-error .error { display: flex; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 500; transition: border-color .15s, background-color .15s, color .15s, transform .12s; user-select: none; }
.chip:hover { border-color: color-mix(in srgb, var(--ink) 50%, transparent); }
.chip:active { transform: scale(.97); }
.chip input, .size input, .day input { position: absolute; opacity: 0; pointer-events: none; }
.chip:has(input:checked) { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
.chip:has(input:focus-visible), .size:has(input:focus-visible), .day:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
.chip small { font-size: 13px; opacity: .8; }
.sizes { display: grid; gap: 8px; }
.size { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); transition: border-color .15s, box-shadow .15s; }
.size:hover { border-color: color-mix(in srgb, var(--ink) 50%, transparent); }
.size:has(input:checked) { border-color: var(--sel); box-shadow: inset 0 0 0 1px var(--sel); }
.size .dot { width: 20px; height: 20px; border-radius: 999px; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; }
.size:has(input:checked) .dot { border-color: var(--sel); background: var(--sel); box-shadow: inset 0 0 0 4px var(--surface); }
.size .what { margin-right: auto; display: grid; }
.size .what b { font-weight: 600; }
.size .what span { font-size: 14px; color: var(--muted); }
.size .p { font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); width: max-content; }
.stepper button { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 999px; display: grid; place-items: center; }
.stepper button:hover { background: var(--tint); }
.stepper output { min-width: 40px; text-align: center; font-weight: 600; }
.qty-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.field { display: grid; gap: 6px; }
.field input, .field textarea { width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); transition: border-color .15s; }
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--ink); }

function applyTheme() {

function estimate() {

}

function calendar(flow) {
  const f = S.form[flow];
  const base = new Date(today.getFullYear(), today.getMonth() + S.cal[flow], 1);
  const lead = (new Date(base.getFullYear(), base.getMonth(), 0) < earliest) && S.cal[flow] === 0;
  const first = (base.getDay() + 6) % 7; const days = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  let cells = DOW.map((d) => `<span class="dow">${d}</span>`).join('') + '<span></span>'.repeat(first);
  for (let n = 1; n <= days; n++) {
    const d = new Date(base.getFullYear(), base.getMonth(), n); const v = iso(d);
    const off = d < earliest || d > latest; const cls = (off ? ' off' : '') + (d.getTime() === today.getTime() ? ' today' : '');
    cells += off ? `<span class="day${cls}" aria-hidden="true">${n}</span>`
      : `<label class="day${cls}"><input type="radio" name="date" value="${v}" ${f.date === v ? 'checked' : ''} aria-label="${niceDate(v)}">${n}</label>`;
  }
  return `<div class="cal" id="cal-${flow}">
    <div class="cal-head"><button type="button" class="icon-btn" data-action="cal" data-d="-1" ${S.cal[flow] <= 0 ? 'disabled' : ''} aria-label="Previous month">${icon('caret-left')}</button>

    <div class="cal-grid">${cells}</div>
  </div>`;
}

function itemSteps(it) {

}
const CUSTOM_STEPS = [
  { id: 'idea', name: 'Idea', title: 'Tell Jana your idea' },
  { id: 'when', name: 'When', title: 'When, and for how many?' },
  { id: 'photo', name: 'Photo', title: 'Got a picture?' },
  { id: 'you', name: 'You', title: 'Where should Jana reply?' },
];
function stepBody(flow, id, it) {
  if (flow === 'custom') return { idea: gIdea(), when: gDate('custom') + gPeople(), photo: gPhoto('custom', 'Inspiration photo') + '<p class="hint">Skip this if you have nothing to show. Words are enough.</p>', you: gYou('custom') }[id];
  return { size: gSize(it), flavour: gFlavour(), date: gDate('item'), extras: gRequests() + gPhoto('item'), you: (S.lastStep === 'combined' ? gRequests() + gPhoto('item') : '') + gYou('item') }[id];
}
const emailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
function problems(flow, id) {
  const f = S.form[flow]; const p = [];
  if (flow === 'item') {
    if (id === 'size' && f.size === '') p.push('size');
    if (id === 'flavour') { if (!f.sponge) p.push('sponge'); if (!f.filling) p.push('filling'); }
  }
  if (flow === 'custom' && id === 'idea' && !f.idea.trim()) p.push('idea');
  if ((id === 'date' || id === 'when') && !f.date) p.push('date');
  if (id === 'you') { if (!f.name.trim()) p.push('name'); if (!emailOk(f.email)) p.push('email'); }
  return p;
}
function check(flow, ids) {
  S.errors = {}; const all = ids.flatMap((id) => problems(flow, id));
  all.forEach((k) => (S.errors[flow + '.' + k] = true));
  return all;
}

  requestAnimationFrame(() => document.body.classList.add('sheet-open'));
  const it = sh.flow === 'item' ? itemBy(S.form.item.slug) : null;
  const steps = sh.flow === 'item' ? itemSteps(it) : CUSTOM_STEPS;
  const kicker = it ? esc(it.title) : 'Something custom';
  if (sh.sent) { el.innerHTML = sentView(sh.flow, it, kicker); return; }
  const step = steps[sh.step]; const last = sh.step === steps.length - 1;
  el.innerHTML = `<div class="sheet-grab"></div>
    <div class="sheet-top"><div class="t"><p>${kicker}</p><h2 class="display" id="sheet-title">${step.title}</h2></div>
      <button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('x')}</button></div>
    <ol class="progress" aria-label="Progress">${steps.map((s, i) => `<li class="${i < sh.step ? 'done' : i === sh.step ? 'now' : ''}" ${i === sh.step ? 'aria-current="step"' : ''}>${s.name}</li>`).join('')}</ol>
    <form class="sheet-body" data-flow="${sh.flow}" novalidate><div class="form step-in">${stepBody(sh.flow, step.id, it)}</div></form>
    <div class="sheet-foot">
      ${it ? `<div class="est"><span>Estimate</span><strong class="num" data-live="estimate">${estimateText()}</strong></div>` : '<div class="est"></div>'}
      ${sh.step > 0 ? `<button class="btn btn-quiet" data-action="back">Back</button>` : ''}
      <button class="btn btn-primary" data-action="${last ? 'send' : 'next'}">${last ? 'Send to Jana' : 'Next'}</button>
    </div>`;
}
function sentView(flow, it, kicker) {
  const f = S.form[flow]; const rows = [];
  if (flow === 'item') {
    const size = it.sizes[f.size];
    rows.push(['Cake', `${f.qty > 1 ? f.qty + ' × ' : ''}${it.title}`], ['Size', size.label]);
    if (it.configurable) rows.push(['Flavour', `${f.sponge} with ${f.filling}`]);
    rows.push(['Pickup', niceDate(f.date)], ['Estimate', eur(estimate())]);
    if (f.requests.trim()) rows.push(['Requests', f.requests]);
  } else {
    rows.push(['For', f.occasion || 'Not said'], ['Pickup', niceDate(f.date)], ['People', 'About ' + f.people]);
    if (f.photo) rows.push(['Photo', f.photo.name]);
  }
  return `<div class="sheet-grab"></div>
    <div class="sheet-top"><div class="t"><p>${kicker}</p></div><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('x')}</button></div>
    <div class="sheet-body"><div class="sent step-in">
      <div class="tick">${icon('check')}</div>
      <h3 class="display" id="sheet-title">Sent to Jana</h3>
      <p>She usually replies within a day, by email to <b style="color:var(--ink)">${esc(f.email)}</b>. Nothing is booked or paid until you both agree.</p>
      <dl class="summary">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    </div></div>
    <div class="sheet-foot"><button class="btn btn-primary btn-block" data-action="done">Back to the cakes</button></div>`;
}

// ---- Prototype panel -------------------------------------------------------------------------
function renderPanel() {
  const fab = document.getElementById('proto-fab'); const p = document.getElementById('proto-panel');
  fab.setAttribute('aria-expanded', S.panel); p.hidden = !S.panel;
  if (!S.panel) return;
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-action="set" data-k="${key}" data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`).join('')}</div>`;
  p.innerHTML = `<h3>Prototype controls</h3><p class="sub">Throwaway. Sample content, nothing is sent.</p>
    <div class="ctl"><span>Item page flow</span>${seg('variant', [['A', 'A: inline form'], ['B', 'B: stepped sheet']])}</div>
    <div class="ctl"><span>Last step (B)</span>${seg('lastStep', [['combined', 'Extras + contact'], ['split', '“Anything else?” step']])}</div>
    <div class="ctl"><span>Palette</span><div class="swatches">${Object.entries(PALETTES).map(([k, v]) => `<button data-action="set" data-k="palette" data-v="${k}" aria-pressed="${S.palette === k}"><i>${v.sw.map((c) => `<b style="background:${c}"></b>`).join('')}</i>${v.name}</button>`).join('')}</div></div>
    <div class="ctl"><span>Theme (also the site’s own toggle, top right)</span>${seg('mode', [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']])}</div>
    <div class="ctl"><span>State</span><div class="readout" data-live="readout"></div></div>`;
  updateReadout();
}
function updateReadout() {
  const r = document.querySelector('[data-live="readout"]'); if (!r) return;
  const sh = S.sheet; const f = sh?.flow === 'custom' ? S.form.custom : S.form.item;
  let steps = ''; if (sh) { const list = sh.flow === 'item' ? itemSteps(itemBy(S.form.item.slug)) : CUSTOM_STEPS; steps = sh.sent ? 'sent' : `${sh.step + 1}/${list.length} ${list[sh.step].id}`; }
  const lines = [
    `route    ${S.route.name === 'item' ? '/cakes/' + S.route.slug : '/'}`,
    `sheet    ${sh ? sh.flow + ', ' + steps : 'closed'}`,
    `taps     ${S.taps}`,
  ];
  if (f && (S.route.name === 'item' || sh)) {
    Object.entries(f).forEach(([k, v]) => { if (k === 'slug') return; lines.push(`${k.padEnd(9)}${k === 'photo' ? (v ? v.name : '-') : (v === '' ? '-' : v)}`); });
    if (sh?.flow !== 'custom' && S.form.item) lines.push(`estimate ${estimateText()}`);
  }
  r.textContent = lines.join('\n');
}
S.taps = 0;

// ---- Render + routing ------------------------------------------------------------------------
function render() {
  applyTheme();
  const page = document.getElementById('page');
  if (S.route.name === 'item') {
    const it = itemBy(S.route.slug);
    if (!S.form.item || S.form.item.slug !== it.slug) { S.form.item = blankItemForm(it); S.cal.item = 0; S.showMore = false; }
    page.innerHTML = itemPage(it);
  } else page.innerHTML = home();
  renderBar(); renderPanel();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const prev = S.route.name + (S.route.slug || '');
  if (h.startsWith('item-') && itemBy(h.slice(5))) S.route = { name: 'item', slug: h.slice(5) };
  else S.route = { name: 'home' };
  const changed = prev !== S.route.name + (S.route.slug || '');
  S.errors = {};
  if (changed || !document.getElementById('page').innerHTML) render();
  if (S.route.name === 'home' && ['cakes', 'about'].includes(h)) requestAnimationFrame(() => document.getElementById(h)?.scrollIntoView());
  else if (changed) scrollTo({ top: 0, behavior: 'instant' });
}
addEventListener('hashchange', route);
addEventListener('resize', () => renderBar());

// ---- Live updates without re-rendering (keeps focus and scroll) -------------------------------
function live() {
  document.querySelectorAll('[data-live="estimate"]').forEach((e) => (e.textContent = estimateText()));
  ['item', 'custom'].forEach((fl) => document.querySelectorAll(`[data-live="date-${fl}"]`).forEach((e) => (e.textContent = niceDate(S.form[fl]?.date))));
  updateReadout();
}
function clearErr(flow, name) {
  if (!S.errors[flow + '.' + name]) return;
  delete S.errors[flow + '.' + name];
  document.querySelectorAll(`[data-flow="${flow}"] [data-err="${name}"]`).forEach((e) => e.classList.remove('has-error'));
}
const flowOf = (el) => el.closest('[data-flow]')?.dataset.flow;

document.addEventListener('change', (e) => {
  const t = e.target; const flow = flowOf(t); if (!flow) return;
  if (t.type === 'radio') { S.form[flow][t.name] = t.value; clearErr(flow, t.name); S.taps++; }
  if (t.type === 'file' && t.files[0]) {
    const file = t.files[0]; const rd = new FileReader();
    rd.onload = () => { S.form[flow].photo = { name: file.name, url: rd.result }; const drop = t.closest('.photo-drop'); drop.querySelector('.thumb').innerHTML = `<img src="${rd.result}" alt="">`; drop.querySelector('b').textContent = file.name; drop.querySelector('span:last-child span').textContent = 'Tap to replace'; updateReadout(); };
    rd.readAsDataURL(file);
  }
  live();
});
document.addEventListener('input', (e) => {
  const t = e.target; const flow = flowOf(t); if (!flow || !('value' in t) || t.type === 'radio' || t.type === 'file') return;
  S.form[flow][t.name] = t.value; clearErr(flow, t.name); live();
});
document.addEventListener('submit', (e) => e.preventDefault());
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; renderSheet(); updateReadout(); } });

function openSheet(flow) {
  if (flow === 'custom' && S.form.custom.__sent) S.form.custom = blankCustomForm();
  S.errors = {}; S.sheet = { flow, step: 0, sent: false }; renderSheet(); updateReadout();
  setTimeout(() => document.querySelector('#sheet .sheet-body input, #sheet .sheet-body textarea')?.focus({ preventScroll: true }), 450);
}
function firstError() {
  const el = document.querySelector('.has-error');
  el?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el?.querySelector('input, textarea')?.focus({ preventScroll: true });
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-action]'); if (!a) { if (e.target.closest('a[href^="#"]')) S.taps++; return; }
  const act = a.dataset.action; S.taps++;
  const flow = flowOf(a) || S.sheet?.flow;
  switch (act) {
    case 'toggle-panel': S.panel = !S.panel; renderPanel(); break;
    case 'set': S[a.dataset.k] = a.dataset.v; save(a.dataset.k + (['variant', 'palette'].includes(a.dataset.k) ? '2' : ''), a.dataset.v); S.taps--;
      if (a.dataset.k === 'lastStep' && S.sheet && !S.sheet.sent) S.sheet.step = 0;
      render(); if (S.sheet) renderSheet(); break;
    case 'cycle-mode': S.mode = MODE_NEXT[S.mode]; save('mode', S.mode); render(); break;
    case 'open-custom': openSheet('custom'); break;
    case 'open-item': openSheet('item'); break;
    case 'close-sheet': S.sheet = null; renderSheet(); updateReadout(); break;
    case 'photo': S.taps--; document.getElementById('gallery-main').src = a.dataset.src; a.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === a)); break;
    case 'more': S.showMore = true; a.outerHTML = esc(itemBy(S.route.slug).long); break;
    case 'qty': { const f = S.form.item; f.qty = Math.max(1, Math.min(20, f.qty + Number(a.dataset.d))); document.querySelectorAll('[data-live="qty"]').forEach((o) => (o.textContent = f.qty)); live(); break; }
    case 'people': { const f = S.form.custom; f.people = Math.max(2, Math.min(150, f.people + Number(a.dataset.d))); document.querySelectorAll('[data-live="people"]').forEach((o) => (o.textContent = f.people)); live(); break; }
    case 'cal': { const fl = a.closest('[data-cal]').dataset.cal; S.cal[fl] = Math.max(0, Math.min(3, S.cal[fl] + Number(a.dataset.d))); a.closest('[data-cal]').innerHTML = calendar(fl); break; }
    case 'next': case 'send': {
      const it = S.sheet.flow === 'item' ? itemBy(S.form.item.slug) : null;
      const steps = it ? itemSteps(it) : CUSTOM_STEPS;
      if (check(S.sheet.flow, [steps[S.sheet.step].id]).length) { renderSheet(); firstError(); break; }
      if (act === 'send') { S.sheet.sent = true; if (S.sheet.flow === 'custom') S.form.custom.__sent = true; }
      else S.sheet.step++;
      renderSheet(); document.querySelector('#sheet .sheet-body')?.scrollTo(0, 0); break;
    }
    case 'back': S.errors = {}; S.sheet.step--; renderSheet(); break;
    case 'send-inline': {
      const it = itemBy(S.form.item.slug);
      if (check('item', itemSteps(it).map((s) => s.id)).length) { const y = scrollY; render(); scrollTo(0, y); firstError(); break; }
      S.sheet = { flow: 'item', step: 0, sent: true }; renderSheet(); break;
    }
    case 'done': S.sheet = null; renderSheet(); S.form.item = null; location.hash = 'cakes'; if (S.route.name === 'home') document.getElementById('cakes')?.scrollIntoView(); break;
  }
  updateReadout();
});

document.querySelectorAll('[data-icon]').forEach((e) => (e.outerHTML = icon(e.dataset.icon)));
route();
</script>
